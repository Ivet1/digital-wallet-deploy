apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.17.1
    helm:
      releaseName: monitoring-stack
      valuesObject:
        alertmanager:
          enabled: true
          alertmanagerSpec:
            secrets:
              - alertmanager-slack-secret
          config:
            global:
              resolve_timeout: 5m
            route:
              group_by: ['alertname', 'namespace']
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 3h
              receiver: 'slack-notifications'
              routes:
                - matchers:
                    - severity = "critical"
                  receiver: 'slack-notifications'
                  repeat_interval: 1h
            receivers:
              - name: 'slack-notifications'
                slack_configs:
                  - api_url_file: /etc/alertmanager/secrets/alertmanager-slack-secret/slack-webhook-url
                    send_resolved: true
                    title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
                    text: >-
                      {{ range .Alerts }}
                      *Alert:* {{ .Annotations.summary }}
                      *Severity:* `{{ .Labels.severity }}`
                      *Namespace:* `{{ .Labels.namespace }}`
                      *Details:* {{ .Annotations.description }}
                      {{ end }}
        prometheus:
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              cert-manager.io/cluster-issuer: "selfsigned-issuer"
            hosts:
              - prometheus.local
            paths:
              - /
            pathType: Prefix
            tls:
              - secretName: prometheus-tls
                hosts:
                  - prometheus.local
          prometheusSpec:
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false
        grafana:
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              cert-manager.io/cluster-issuer: "selfsigned-issuer"
            hosts:
              - grafana.local
            path: /
            tls:
              - secretName: grafana-tls
                hosts:
                  - grafana.local
          persistence:
            enabled: true
            size: 5Gi
            storageClassName: standard
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m