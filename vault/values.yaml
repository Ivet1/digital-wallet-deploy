injector:
  replicas: 1

server:
  dev:
    enabled: false
  standalone:
    enabled: true
    config: |
      ui = true
      disable_mlock = true

      storage "file" {
        path = "/vault/data"
      }

      listener "tcp" {
        address         = "[::]:8200"
        cluster_address = "[::]:8201"
        tls_disable     = 1
      }
  dataStorage:
    enabled: true
    size: 1Gi
    storageClass: standard
  auditStorage:
    enabled: false
