name: Validate chart and test deployment

on:
  pull_request:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  lint:
    name: Lint and render the chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Helm lint
        run: helm lint charts/digital-wallet-chart -f charts/digital-wallet-chart/values.yaml

      - name: Helm template renders
        run: helm template digital-wallet-app charts/digital-wallet-chart -f charts/digital-wallet-chart/values.yaml > /dev/null

      - name: Scan chart for misconfigurations (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: 'charts'
          format: 'table'
          exit-code: '0'

  template-check:
    name: Template debug check
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Verify chart rendering with debug output
        run: helm template digital-wallet-test charts/digital-wallet-chart --debug > /dev/null