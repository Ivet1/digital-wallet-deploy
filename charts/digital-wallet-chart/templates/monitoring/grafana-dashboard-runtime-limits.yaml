apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-digital-wallet-runtime-limits
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  digital-wallet-runtime-limits.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "id": 1,
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "sum(rate(aspnetcore_routing_match_attempts_total{namespace=\"default\",container=\"digital-wallet-chart\"}[1m])) by (pod, http_route, aspnetcore_routing_match_status)",
              "legendFormat": "{{pod}} {{http_route}} ({{aspnetcore_routing_match_status}})",
              "refId": "A"
            }
          ],
          "title": "ASP.NET Core Routing Match Rate (ops/s)",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "id": 2,
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "sum(aspnetcore_memory_pool_pooled_bytes{namespace=\"default\",container=\"digital-wallet-chart\"}) by (pod)",
              "legendFormat": "Pooled - {{pod}}",
              "refId": "A"
            },
            {
              "expr": "sum(aspnetcore_memory_pool_rented_bytes_total{namespace=\"default\",container=\"digital-wallet-chart\"}) by (pod)",
              "legendFormat": "Rented total - {{pod}}",
              "refId": "B"
            }
          ],
          "title": "ASP.NET Core Memory Pool",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "id": 3,
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_cfs_throttled_periods_total{namespace=\"default\",container=\"digital-wallet-chart\"}[1m])) by (pod) / clamp_min(sum(rate(container_cpu_cfs_periods_total{namespace=\"default\",container=\"digital-wallet-chart\"}[1m])) by (pod), 0.0001)",
              "legendFormat": "Throttled ratio - {{pod}}",
              "refId": "A"
            }
          ],
          "title": "CPU Throttled Ratio",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "id": 4,
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"default\",container=\"digital-wallet-chart\"}) by (pod)",
              "legendFormat": "Working Set - {{pod}}",
              "refId": "A"
            },
            {
              "expr": "sum(container_memory_rss{namespace=\"default\",container=\"digital-wallet-chart\"}) by (pod)",
              "legendFormat": "RSS - {{pod}}",
              "refId": "B"
            }
          ],
          "title": "Memory Working Set vs RSS",
          "type": "timeseries"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "title": "Digital Wallet - Runtime & Limits",
      "uid": "digital-wallet-runtime-limits",
      "version": 1
    }
