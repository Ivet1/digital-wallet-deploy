apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "digital-wallet-chart.fullname" . }}-vault-init
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-creation
spec:
  template:
    spec:
      serviceAccountName: {{ include "digital-wallet-chart.serviceAccountName" . }}
      restartPolicy: OnFailure
      containers:
        - name: vault-init
          image: hashicorp/vault:2.0.4
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu

              echo "Waiting for Vault..."
              until wget -qO- http://vault.default.svc:8200/v1/sys/health; do
                sleep 2
              done

              echo "Connecting to Vault..."
              export VAULT_ADDR='http://vault.default.svc:8200'
              export VAULT_TOKEN='root'

              echo "Checking Kubernetes authentication..."
              if ! vault auth list -format=json | grep -q '"kubernetes/"'; then
                vault auth enable kubernetes
              fi

              echo "Configuring Kubernetes authentication..."
              vault write auth/kubernetes/config \
                kubernetes_host="https://kubernetes.default.svc:443"

              echo "Creating policy for PostgreSQL secret..."
              vault policy write digital-wallet-policy - <<'POLICY'
              path "secret/data/digital-wallet/postgres" {
                capabilities = ["read"]
              }
              POLICY

              echo "Configuring Kubernetes role..."
              vault write auth/kubernetes/role/digital-wallet-role \
                bound_service_account_names={{ include "digital-wallet-chart.serviceAccountName" . }} \
                bound_service_account_namespaces={{ .Release.Namespace }} \
                policies=digital-wallet-policy \
                ttl=1h

              echo "Vault configuration completed successfully!"
